name: Build & Release Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.3)'
        required: false
        default: 'v1.0.3'
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CI: true
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 4. Configure Android SDK Environment & Licenses
        run: |
          echo "Using Android SDK at: $ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 5. Install Dependencies
        run: npm ci

      - name: 6. Prebuild Android Native Files
        env:
          REACT_NATIVE_ARCHITECTURES: 'arm64-v8a'
        run: |
          cd apps/mobile
          npx expo prebuild --platform android --clean --no-install

      - name: 7. Compile Android APK with Gradle
        env:
          REACT_NATIVE_ARCHITECTURES: 'arm64-v8a'
        run: |
          cd apps/mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: 8. Prepare & Sign APK Artifact
        run: |
          mkdir -p build-output
          TAG="${{ github.event.inputs.version || github.ref_name || 'v1.0.3' }}"
          OUTPUT_APK="build-output/Manju_Stores_${TAG}.apk"

          # Locate generated APK
          FOUND_APK=$(find apps/mobile/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$FOUND_APK" ]; then
            FOUND_APK=$(find apps/mobile/android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          fi

          if [ -z "$FOUND_APK" ]; then
            echo "Error: No APK file found in build outputs!"
            exit 1
          fi

          echo "Found APK: $FOUND_APK"

          # Check if signature verification is needed
          NEEDS_SIGNING=false
          if [[ "$FOUND_APK" == *"unsigned"* ]]; then
            NEEDS_SIGNING=true
          fi

          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            if ! "$APKSIGNER" verify "$FOUND_APK" >/dev/null 2>&1; then
              echo "Verification failed: APK is not signed."
              NEEDS_SIGNING=true
            else
              echo "Verification passed: APK is already signed."
            fi
          fi

          if [ "$NEEDS_SIGNING" = true ]; then
            echo "Signing APK with project release keystore..."
            RELEASE_KEYSTORE=""
            if [ -f "keystores/release.keystore" ]; then
              RELEASE_KEYSTORE="keystores/release.keystore"
            elif [ -f "apps/mobile/keystores/release.keystore" ]; then
              RELEASE_KEYSTORE="apps/mobile/keystores/release.keystore"
            elif [ -f "apps/mobile/android/keystores/release.keystore" ]; then
              RELEASE_KEYSTORE="apps/mobile/android/keystores/release.keystore"
            fi

            if [ -n "$RELEASE_KEYSTORE" ] && [ -f "$RELEASE_KEYSTORE" ]; then
              echo "Using permanent project release keystore: $RELEASE_KEYSTORE"
              if [ -n "$APKSIGNER" ]; then
                "$APKSIGNER" sign --ks "$RELEASE_KEYSTORE" --ks-pass pass:manjustore123 --key-pass pass:manjustore123 --ks-key-alias manjustore "$FOUND_APK"
              else
                jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore "$RELEASE_KEYSTORE" -storepass manjustore123 -keypass manjustore123 "$FOUND_APK" manjustore
              fi
            else
              echo "Falling back to debug keystore..."
              DEBUG_KEYSTORE="$HOME/.android/debug.keystore"
              if [ ! -f "$DEBUG_KEYSTORE" ]; then
                mkdir -p "$HOME/.android"
                keytool -genkey -v -keystore "$DEBUG_KEYSTORE" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AndroidDebug,O=Android,C=US"
              fi
              if [ -n "$APKSIGNER" ]; then
                "$APKSIGNER" sign --ks "$DEBUG_KEYSTORE" --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey "$FOUND_APK"
              else
                jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore "$DEBUG_KEYSTORE" -storepass android -keypass android "$FOUND_APK" androiddebugkey
              fi
            fi
          fi

          cp "$FOUND_APK" "$OUTPUT_APK"
          echo "Final APK ready at: $OUTPUT_APK"
          ls -lh build-output/

      - name: 9. Upload Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Manju_Stores_APK
          path: build-output/*.apk
          retention-days: 30

      - name: 10. Publish GitHub Release with APK Attached
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name || 'v1.0.3' }}
          name: MANJU STORES Official Release ${{ github.event.inputs.version || github.ref_name || 'v1.0.3' }}
          body: |
            ## 📱 MANJU STORES — Official Android Release

            Official standalone build for Android Mobile Phones & Android Tablets.

            - **Version**: `${{ github.event.inputs.version || github.ref_name || 'v1.0.3' }}`
            - **Target Architecture**: `arm64-v8a` (Optimized ~28 MB)
            - **Package**: `com.manjuhardware.store`

            ### ⬇️ Direct Download
            Click the `.apk` file below in the **Assets** section to download and install directly on your device.
          files: build-output/*.apk
          generate_release_notes: true
